name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2

      - run: npm ci
      - run: npm run build --workspaces --if-present

      # The binaries must pass the same gate as the tree they come from.
      - run: npx vitest run
      - run: node packages/agent/dist/cli.js run examples/selftest.md --out /tmp/selftest.runtpt

      - name: Build the standalone binaries
        run: node scripts/bundle.mjs --all

      - name: Check the Linux binary actually runs
        run: |
          tar -xzf dist/runtpt-*-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          /tmp/runtpt --version
          /tmp/runtpt run examples/selftest.md --out /tmp/from-binary.runtpt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
