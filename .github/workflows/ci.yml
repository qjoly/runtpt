name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        # A generated module, so it is not in the repository: make it first.
      - run: node scripts/embed-web.mjs
      - run: npx tsc -b
      - run: npm test
      - run: npm run build --workspaces --if-present

  # The point of the headless mode: the repository proves its own runbooks still work.
  runbooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/embed-web.mjs
      - run: npm run build --workspaces --if-present
      - run: node packages/agent/dist/cli.js run examples/selftest.md --out /tmp/selftest.runtpt
